<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>YachtWay link board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#F4F6F5;--panel:#fff;--ink:#10222B;--ink-2:#3D545E;--ink-3:#708992;
 --rule:#C6D2D5;--good:#0F6E72;--bad:#C4166B}
@media (prefers-color-scheme:dark){:root{--paper:#0A1418;--panel:#132329;--ink:#E2EBEA;
 --ink-2:#A9BCC1;--ink-3:#7C9198;--rule:#2A3F47;--good:#54C3C5;--bad:#FF6FAE}}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);margin:0;min-height:100vh;
 display:flex;align-items:center;justify-content:center;padding:24px;
 font-family:"Archivo",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
 padding:30px 30px 26px;width:100%;max-width:392px;
 box-shadow:0 10px 34px rgba(16,34,43,.09)}
h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-3);
 letter-spacing:.07em;text-transform:uppercase;margin:8px 0 0}
p.note{color:var(--ink-2);font-size:13.5px;line-height:1.55;margin:18px 0 0}
form{display:flex;flex-direction:column;gap:10px;margin-top:20px}
label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
input{font-family:inherit;font-size:15px;color:var(--ink);background:var(--paper);
 border:1px solid var(--rule);border-radius:8px;padding:11px 13px;width:100%}
input:focus{outline:2px solid var(--good);outline-offset:1px;border-color:var(--good)}
button{font-family:inherit;font-size:14px;font-weight:600;color:var(--paper);
 background:var(--ink);border:0;border-radius:8px;padding:12px 16px;cursor:pointer}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:progress}
button:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.msg{font-size:13px;min-height:19px;margin:0;color:var(--bad);font-weight:600}
.msg.working{color:var(--ink-3);font-weight:400}
</style></head>
<body>
<main class="card">
  <h1>YachtWay link board</h1>
  <p class="sub">Internal &middot; password required</p>
  <p class="note">This page is stored encrypted. The password decrypts it in your browser, so nothing readable leaves the server without it.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Open the board</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

  var f=document.getElementById("f"), pw=document.getElementById("pw"),
      go=document.getElementById("go"), msg=document.getElementById("msg");

  function b2u(b64){
    var s=atob(b64), a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
    return a;
  }

  function say(t, working){
    msg.textContent = t;
    msg.className = working ? "msg working" : "msg";
  }

  f.addEventListener("submit", function(e){
    e.preventDefault();
    var pass = pw.value;
    if(!pass){ say("Enter the password."); return; }
    if(!window.crypto || !window.crypto.subtle){
      say("This browser cannot decrypt the page. Use a current browser over https.");
      return;
    }
    go.disabled = true;
    say("Decrypting…", true);

    var enc = new TextEncoder();
    window.crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return window.crypto.subtle.deriveKey(
          {name:"PBKDF2", salt:b2u(SALT), iterations:ITER, hash:"SHA-256"},
          base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      })
      .then(function(key){
        return window.crypto.subtle.decrypt({name:"AES-GCM", iv:b2u(IV)}, key, b2u(PAYLOAD));
      })
      .then(function(plain){
        var html = new TextDecoder().decode(plain);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(){
        go.disabled = false;
        say("Wrong password.");
        pw.select();
      });
  });
